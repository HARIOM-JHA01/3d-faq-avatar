name: Deploy Vite App to GitHub Pages

on:
    # Trigger the workflow on push to the main branch
    push:
        branches: ["Main"]

    # Allow manual triggers from the Actions tab
    workflow_dispatch:

# Set permissions for GitHub Pages deployment
permissions:
    contents: read
    pages: write
    id-token: write

# Ensure only one deployment runs at a time
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # Job to build the Vite project
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18 # You can specify another version if needed

            - name: Install dependencies
              run: npm install

            - name: Upload build output
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist # Vite outputs the build files to the 'dist' folder by default

    # Job to deploy to GitHub Pages
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
